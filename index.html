    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
    /* Universal Dark Reader Kill Switch (Rule 9) */
    (function() {
        function disarmDarkReader() {
            const drStyles = document.querySelectorAll('style.darkreader, style[class*="darkreader"]');
            drStyles.forEach(el => el.remove());
        }
        disarmDarkReader();
        const observer = new MutationObserver(mutations => {
            for (const m of mutations) {
                for (const node of m.addedNodes) {
                    if (node.nodeType === 1 && (node.classList?.contains('darkreader') || (node.tagName === 'STYLE' && node.className.includes('darkreader')))) {
                        node.remove();
                    }
                }
            }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', disarmDarkReader);
        window.addEventListener('load', disarmDarkReader);
    })();
    </script>

    <!-- Instant Head Pre-Hydration to prevent FOUC -->
    <script>
    (function() {
        try {
            var cachedThemeCss = localStorage.getItem('automybiz_punch_theme_css');
            if (cachedThemeCss) {
                var styleEl = document.createElement('style');
                styleEl.id = 'epwDynamicThemeStyles';
                styleEl.textContent = cachedThemeCss;
                document.head.appendChild(styleEl);
            }
        } catch (e) {}
    })();
    </script>

    <style id="epwThemeStylesFallback">
        :root {
            --page-bg: #011;
            --card-bg: #011;
            --card-header-bg: #033;
            --card-header-hover: #044;
            --card-hover-bg: #022;
            --border-color: #0FF;
            --accent-cyan: #0FF;
            --accent-blue: #3BF;
            --accent-green: #0F8;
            --accent-yellow: #FA0;
            --accent-red: #F33;
            --text-primary: #FFF;
            --text-secondary: #9AB;
            --text-muted: #79A;
            --font-family: 'Inter', -apple-system, sans-serif;
            --indent-step: 26px;

            --card-border-color-1: #0FF;
            --card-border-color-2: #F80;
            --card-border-speed: 30s;
            --special-effects-color-1: #064;
            --special-effects-color-2: #0FF;
            --special-effects-color-3: #3BF;
            --special-effects-color-4: #A85;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--page-bg);
            background-image: 
                radial-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
                radial-gradient(rgba(0, 0, 0, 0.8) 15%, transparent 16%);
            background-size: 24px 24px, 16px 16px;
            color: var(--text-primary);
            line-height: 1.5;
            padding: 24px 16px 80px;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        /* Top Control Header Card */
        .header-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .brand-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title span.cyan {
            color: var(--accent-cyan);
        }

        /* Combined Globals ID & Health Status Pill System */
        .header-pill-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .status-pill {
            background-color: var(--card-header-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            line-height: 1.2;
            text-decoration: none;
        }

        .status-pill:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .status-pill.status-healthy {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border-color: #10b981;
        }

        .status-pill.status-probing {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .status-pill.status-warning {
            background: rgba(250, 160, 0, 0.15);
            color: var(--accent-yellow);
            border-color: var(--accent-yellow);
            animation: pulseWarning 2.5s infinite;
        }

        .status-pill.status-error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: #ef4444;
        }

        @keyframes pulseWarning {
            0%, 100% { box-shadow: 0 0 4px rgba(250, 160, 0, 0.3); }
            50% { box-shadow: 0 0 12px rgba(250, 160, 0, 0.6); }
        }

        /* Popover Tooltip for Status Pill */
        .status-tooltip-popover {
            visibility: hidden;
            width: max-content;
            min-width: 320px;
            max-width: 440px;
            background: #0d121f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            z-index: 10000;
            box-shadow: 0 12px 35px rgba(0,0,0,0.85);
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            font-size: 11.5px;
            line-height: 1.5;
            user-select: text;
        }

        .header-pill-wrap:hover .status-tooltip-popover {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .tooltip-hdr {
            font-weight: 700;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
            margin-bottom: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tooltip-code-box {
            font-family: monospace;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 4px;
            padding: 6px 8px;
            margin: 6px 0;
            word-break: break-all;
            color: #fff;
            user-select: all;
        }

        .tooltip-footer-note {
            color: var(--text-muted);
            font-size: 10.5px;
            display: block;
            margin-top: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: var(--card-header-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .btn-action:hover {
            border-color: var(--accent-cyan);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #011;
            font-weight: 800;
        }

        .btn-primary:hover {
            background: #fff;
            color: #011;
        }

        /* Progress Bar */
        .progress-section {
            margin-top: 16px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.15);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            width: 0%;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==========================================================================
           Clean Slate / Empty Onboarding Welcome Card
           ========================================================================== */
        .welcome-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 34px 28px;
            margin: 20px 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        .welcome-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .welcome-header h2 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #fff;
        }

        .welcome-header h2 span {
            color: var(--accent-cyan);
        }

        .welcome-intro {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .welcome-steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .welcome-step-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px 16px;
            border-left: 3px solid var(--accent-cyan);
        }

        .welcome-step-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .welcome-step-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .welcome-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        /* ==========================================================================
           Decoupled Border Animation Architecture (@property Isolated)
           ========================================================================== */
        @property --border-angle {
            syntax: "<angle>";
            inherits: false;
            initial-value: 0deg;
        }

        @keyframes rotateBorderBeam {
            to { --border-angle: 360deg; }
        }

        @keyframes flowBeamRail {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .section-deck {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            position: relative;
        }

        .section-deck:hover {
            border-color: var(--accent-cyan);
        }

        .section-deck.is-collapsed {
            border-color: var(--border-color);
        }

        .section-deck.section-dragging {
            opacity: 0.35;
            border: 1.5px dashed var(--accent-cyan);
        }

        .card-border-animated .section-deck:not(.is-collapsed) {
            border: 1.5px solid transparent !important;
            animation: rotateBorderBeam var(--card-border-speed, 30s) linear infinite !important;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }

        .card-border-animated .section-deck:not(.is-collapsed) .section-header {
            position: relative;
            background: var(--card-header-hover) !important;
        }

        .card-border-animated .section-deck:not(.is-collapsed) .section-header::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 1.5px;
            z-index: 2;
            pointer-events: none;
        }

        /* Effect C: Hue Sweep */
        .card-border-animated.effect-hue-sweep .section-deck:not(.is-collapsed) {
            background: 
                linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                conic-gradient(
                    in hsl longer hue from var(--border-angle),
                    var(--card-border-color-1) 0%,
                    var(--card-border-color-2) 50%,
                    var(--card-border-color-1) 100%
                ) border-box !important;
        }
        .card-border-animated.effect-hue-sweep .section-deck:not(.is-collapsed) .section-header::after {
            background: linear-gradient(
                90deg,
                var(--card-border-color-1) 0%,
                #38BDF8 25%,
                var(--card-border-color-2) 50%,
                #A855F7 75%,
                var(--card-border-color-1) 100%
            );
            background-size: 300% 100%;
            animation: flowBeamRail var(--card-border-speed, 30s) linear infinite !important;
        }

        .section-drop-indicator {
            height: 4px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 2px;
            margin: 8px 0;
            box-shadow: 0 0 12px var(--accent-cyan);
            pointer-events: none;
        }

        .section-header {
            background: var(--card-header-bg);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .section-header:hover {
            background: var(--card-header-hover);
        }

        .section-deck.is-collapsed .section-header {
            border-bottom: none;
        }

        .section-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .drag-handle {
            color: var(--text-muted);
            cursor: grab;
            font-size: 14px;
            padding: 2px 6px;
            user-select: none;
            opacity: 0.5;
            transition: opacity 0.2s, color 0.2s, transform 0.15s ease;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .drag-handle:hover {
            opacity: 1;
            color: var(--accent-cyan);
            transform: scale(1.15);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-cyan);
            border: none;
            background: transparent;
            font-family: inherit;
            width: 100%;
            outline: none;
            cursor: text;
        }

        .section-title:focus {
            border-bottom: 1px dashed var(--accent-cyan);
        }

        .section-meta-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .section-counter-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.3px;
        }

        .section-counter-badge.all-done {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.35);
        }

        .accordion-chevron {
            font-size: 11px;
            color: var(--accent-cyan);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-block;
        }

        .section-deck.is-collapsed .accordion-chevron {
            transform: rotate(-90deg);
            color: var(--text-muted);
        }

        .section-body {
            transition: max-height 0.3s ease-out;
            overflow: hidden;
            background: var(--card-bg);
        }

        .section-deck.is-collapsed .section-body {
            display: none;
        }

        .task-list {
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .task-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: background 0.15s ease, border-color 0.15s ease, padding-left 0.2s ease;
            position: relative;
        }

        .task-row:hover {
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .task-row.is-dragging {
            opacity: 0.35;
            background: rgba(0, 229, 255, 0.05);
            border: 1px dashed var(--accent-cyan);
        }

        .task-row.is-subtree-child {
            opacity: 0.45;
            border-left: 2px dashed rgba(0, 229, 255, 0.5) !important;
        }

        .drop-indicator-line {
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), #3b82f6);
            border-radius: 2px;
            margin: 2px 0;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: margin-left 0.15s ease;
            pointer-events: none;
        }

        .task-row.is-nested {
            border-left: 2px solid rgba(0, 229, 255, 0.25);
            border-radius: 0 8px 8px 0;
        }

        .nested-elbow {
            color: rgba(0, 229, 255, 0.4);
            font-size: 12px;
            user-select: none;
            margin-right: 2px;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .task-checkbox-wrap {
            padding-top: 3px;
            flex-shrink: 0;
        }

        .task-checkbox {
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: var(--accent-green);
        }

        .task-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .task-title-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            padding: 1px 0;
            transition: color 0.15s ease;
        }

        .task-title-input:focus {
            border-bottom: 1px dashed var(--accent-cyan);
        }

        .task-notes-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-family: inherit;
            outline: none;
            padding: 1px 0;
        }

        .task-notes-input:focus {
            border-bottom: 1px dashed var(--text-secondary);
            color: var(--text-secondary);
        }

        .task-row.is-checked .task-title-input {
            text-decoration: line-through;
            color: var(--text-muted) !important;
        }

        .task-row.is-checked .task-notes-input {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.15s ease;
            flex-shrink: 0;
        }

        .task-row:hover .task-actions {
            opacity: 1;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-icon.delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .quick-add-wrap {
            padding: 10px 16px 14px;
            border-top: 1px dashed var(--border-color);
        }

        .quick-add-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 0.88rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .quick-add-input:focus {
            border-color: var(--accent-cyan);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #111827;
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;

</head>
<body class="card-border-animated effect-hue-sweep">

<div class="container">

    <!-- Header Control Bar -->
    <div class="header-card">
        <div class="header-top">
            <div class="brand-title-wrap">
                <div class="brand-title">
                    ⚡ AutoMyBiz <span class="cyan">// Punch List</span>
                </div>
                
                <!-- Combined Globals ID & Sheet Health Status Pill -->
                <div class="header-pill-wrap">
                    <button id="sheetHealthPill" class="status-pill status-probing" onclick="copySheetId()" title="Click to copy Sheet ID">
                        <span id="pillIcon">📋</span>
                        <span id="pillText">Connecting to Sheet...</span>
                    </button>
                    <div class="status-tooltip-popover">
                        <div class="tooltip-hdr">
                            <span>📋</span>
                            <span>Google Sheet Connection</span>
                        </div>
                        <div id="tooltipStatusNotice">Probing Google Sheet connection...</div>
                        <div class="tooltip-code-box" id="tooltipSheetId">Loading...</div>
                        <span class="tooltip-footer-note" id="tooltipFooterNote">Click pill to copy full Sheet ID</span>
                    </div>
                </div>

                <span class="client-badge" id="clientBadge">Client Workspace</span>
            </div>

            <div class="header-actions">

    // =========================================================================
    // HIGH-VELOCITY EDGE THEME ENGINE
    // =========================================================================
    async function fetchAndApplyLiveTheme() {
        try {
            const isForceRefresh = urlParams.has('refresh') && urlParams.get('refresh') !== '0' && urlParams.get('refresh') !== 'false';
            const fetchUrl = SETTINGS_GATEWAY_DOMAIN + '/?action=styles&gsheet_globals_id=' + ACTIVE_GLOBALS_ID + (isForceRefresh ? '&refresh=1' : '') + '&t=' + Date.now();

            const response = await fetch(fetchUrl);
            if (!response.ok) return;

            const data = await response.json();
            if (!data || !data.success) return;

            let activeThemeName = "DARK EMERALD MAROON";
            let tokens = {};

            if (data.tokens && typeof data.tokens === 'object') {
                tokens = data.tokens;
                if (data.active_admin_theme_name) activeThemeName = data.active_admin_theme_name;
                else if (data.active_theme_name) activeThemeName = data.active_theme_name;
            } else if (Array.isArray(data.styles)) {
                const sRows = data.styles;
                const adminRow = sRows.find(r => String(r[1] || r[0] || '').trim().toUpperCase() === "ACTIVE_ADMIN_THEME_NAME");
                const generalRow = sRows.find(r => String(r[1] || r[0] || '').trim().toUpperCase() === "ACTIVE_THEME_NAME" || String(r[1] || r[0] || '').trim().toUpperCase() === "ACTIVE_PUBLIC_THEME_NAME");

                if (adminRow && (adminRow[2] || adminRow[1])) {
                    activeThemeName = String(adminRow[2] || adminRow[1]).trim().toUpperCase();
                } else if (generalRow && (generalRow[2] || generalRow[1])) {
                    activeThemeName = String(generalRow[2] || generalRow[1]).trim().toUpperCase();
                }

                let activeColIdx = -1;
                for (let r = 0; r < Math.min(sRows.length, 8); r++) {
                    const row = sRows[r];
                    for (let c = 2; c < row.length; c++) {
                        if (String(row[c] || '').trim().toUpperCase() === activeThemeName) {
                            activeColIdx = c;
                            break;
                        }
                    }
                    if (activeColIdx !== -1) break;
                }

                if (activeColIdx === -1) activeColIdx = 2;

                for (let r = 0; r < sRows.length; r++) {
                    const k = String(sRows[r][1] || sRows[r][0] || '').trim().toUpperCase();
                    if (!k || k === "SETTING NAME" || k.startsWith("<--") || k.startsWith("<~~")) continue;
                    const val = sRows[r][activeColIdx];
                    if (val !== undefined && val !== null && String(val).trim() !== "") {
                        tokens[k] = String(val).trim();
                    }
                }
            }

            const queryTheme = urlParams.get('theme') || urlParams.get('active_theme');
            if (queryTheme) {
                activeThemeName = queryTheme.replace(/_/g, () => ' ').trim().toUpperCase();
            }

            // Map Sheet Tokens
            const mainBg        = tokens["MAIN_BG_COLOR"] || "#011";
            const cardBg        = tokens["CARD_BODY_BG_COLOR_1"] || tokens["CARD_BODY_BG_COLOR"] || "#011";
            const cardTitleBg1  = tokens["CARD_TITLE_BG_COLOR_1"] || "#033";
            const cardTitleBg2  = tokens["CARD_TITLE_BG_COLOR_2"] || "#044";
            const cardTitleTxt1 = tokens["CARD_TITLE_TEXT_COLOR_1"] || tokens["MAIN_TITLE_TEXT_COLOR_1"] || "#0FF";
            const cardTitleTxt2 = tokens["CARD_TITLE_TEXT_COLOR_2"] || "#FFF";
            const borderClr     = tokens["MAIN_BORDER_COLOR"] || tokens["CARD_BORDER_COLOR_1"] || "#0FF";
            const cardBorder1   = tokens["CARD_BORDER_COLOR_1"] || borderClr;
            const cardBorder2   = tokens["CARD_BORDER_COLOR_2"] || tokens["ACCENT_COLOR_2"] || "#F80";
            const textPrimary   = tokens["MAIN_TEXT_COLOR_1"] || "#FFF";
            const textSecondary = tokens["MAIN_TEXT_COLOR_2"] || "#9AB";
            const highlight     = tokens["MAIN_LINK_COLOR_1"] || tokens["SECTION_TITLE_TEXT_COLOR"] || "#0FF";

            const fx1 = tokens["SPECIAL_EFFECTS_COLOR_1"] || "#064";
            const fx2 = tokens["SPECIAL_EFFECTS_COLOR_2"] || "#0FF";
            const fx3 = tokens["SPECIAL_EFFECTS_COLOR_3"] || "#3BF";
            const fx4 = tokens["SPECIAL_EFFECTS_COLOR_4"] || "#A85";

            const isAnimateEnabled = (tokens['CARD_BORDER_ANIMATE_ENABLE'] === true || String(tokens['CARD_BORDER_ANIMATE_ENABLE']).toUpperCase() === 'TRUE' || tokens['CARD_BORDER_ANIMATE_ENABLE'] === undefined);
            const animSpeed = tokens['CARD_BORDER_ANIMATE_SPEED'] || '30s';
            const animEffect = String(tokens['CARD_BORDER_ANIMATE_EFFECT'] || 'Hue Sweep').toLowerCase().replace(/\s+/g, () => '-');

            document.body.style.setProperty('--card-border-speed', animSpeed);
            document.body.classList.toggle('card-border-animated', isAnimateEnabled);
            document.body.classList.remove('effect-laser-comet', 'effect-dual-tone-blend', 'effect-hue-sweep', 'effect-fx-rainbow');
            if (isAnimateEnabled) {
                document.body.classList.add('effect-' + animEffect);
            }

            const generatedCss = `
                :root {
                    --page-bg: ${mainBg} !important;
                    --card-bg: ${cardBg} !important;
                    --card-header-bg: ${cardTitleBg1} !important;
                    --card-header-hover: ${cardTitleBg2} !important;
                    --border-color: ${borderClr} !important;
                    --card-border-color-1: ${cardBorder1} !important;
                    --card-border-color-2: ${cardBorder2} !important;
                    --accent-cyan: ${highlight} !important;
                    --text-primary: ${textPrimary} !important;
                    --text-secondary: ${textSecondary} !important;

                    --special-effects-color-1: ${fx1} !important;
                    --special-effects-color-2: ${fx2} !important;
                    --special-effects-color-3: ${fx3} !important;

                .section-header {
                    background: ${cardTitleBg1} !important;
                }

                .section-header:hover {
                    background: ${cardTitleBg2} !important;
                }

                .section-deck:not(.is-collapsed) .section-header {
                    background: ${cardTitleBg2} !important;
                }

                .section-title, .accordion-chevron {
                    color: ${cardTitleTxt1} !important;
                }
            `;

            let liveStyleEl = document.getElementById('epwDynamicThemeStyles');
            if (!liveStyleEl) {
                liveStyleEl = document.createElement('style');
                liveStyleEl.id = 'epwDynamicThemeStyles';
                document.head.appendChild(liveStyleEl);
            }
            liveStyleEl.textContent = generatedCss;

            localStorage.setItem('automybiz_punch_theme_css', generatedCss);
            localStorage.setItem('automybiz_punch_theme_name', activeThemeName);

        } catch (err) {
            console.warn('[AutoMyBiz Theme Handshake]:', err);
        }
    }

        if (pillText) pillText.innerText = text;

        if (tooltipId) tooltipId.innerText = ACTIVE_GSHEET_ID || '(None provided)';

            tooltipNotice.innerHTML = notice;
            tooltipNotice.style.color = isWarning ? 'var(--accent-yellow)' : 'var(--text-secondary)';
        }
        if (tooltipFooter) {
            tooltipFooter.innerHTML = 'Click pill to copy Sheet ID • <a href="' + GOOGLE_DOCS_DOMAIN + '/spreadsheets/d/' + ACTIVE_GSHEET_ID + '" target="_blank" style="color:var(--accent-cyan); text-decoration:underline;">Open Google Sheet ↗</a>';
        }

            if (pillIcon) pillIcon.innerText = '⚠️';
        } else if (state === 'error') {
            if (pillIcon) pillIcon.innerText = '❌';
        } else {
            if (pillIcon) pillIcon.innerText = '⌛';
        }
    }

    async function fetchLiveGSheetData(isManualSync = false) {
        if (!ACTIVE_GSHEET_ID) {
            updateSheetPillUI('warning', 'No Sheet ID', 'No gsheet_punch_list_id found in URL parameters.', true);
            renderEmptyWelcomeState();
            return;
        }

        const shortId = ACTIVE_GSHEET_ID.length > 12 ? (ACTIVE_GSHEET_ID.substring(0, 10) + '...') : ACTIVE_GSHEET_ID;
        updateSheetPillUI('probing', 'Probing: ' + shortId, 'Querying Google Sheet for active tasks...', false);

        const gvizUrl = GOOGLE_DOCS_DOMAIN + '/spreadsheets/d/' + ACTIVE_GSHEET_ID + '/gviz/tq?sheet=Sheet1&headers=1&tqx=out:json&t=' + Date.now();

        try {
            const res = await fetch(gvizUrl);
            
            // Check if Google blocked access due to restricted permissions
            if (!res.ok) {
                handleConnectionFailure(isManualSync, 'Google Sheet access is restricted (401/403). Set General access to "Anyone with the link can view".');
                return;
            }

            const text = await res.text();
            const startIdx = text.indexOf('{');
            const endIdx = text.lastIndexOf('}');
            if (startIdx === -1 || endIdx === -1) {
                handleConnectionFailure(isManualSync, 'Received unparseable response from Google Sheets.');
                return;
            }

            const json = JSON.parse(text.substring(startIdx, endIdx + 1));
            const rows = json.table?.rows || [];

            // If the sheet has no rows, render the clean Welcome State
            if (!rows.length) {
                TASKS_DATA = [];
                updateSheetPillUI('healthy', 'Sheet: ' + shortId + ' ⚡ Empty', '✓ Live Google Sheet connected successfully. Sheet contains 0 tasks.', false);
                renderEmptyWelcomeState();
                return;
            }

            const parsed = [];
            rows.forEach((r, idx) => {
                const c = r.c || [];
                const isVis = c[0] ? (c[0].v === true || String(c[0].v).toUpperCase() === 'TRUE') : true;
                const taskId = c[1]?.v ? String(c[1].v).trim() : 'TASK_' + (idx + 1);
                const parentId = c[2]?.v ? String(c[2].v).trim() : '';
                const level = c[3]?.v !== undefined ? parseInt(c[3].v, 10) : 1;
                const order = c[4]?.v !== undefined ? parseInt(c[4].v, 10) : idx + 1;
                const isChecked = c[5] ? (c[5].v === true || String(c[5].v).toUpperCase() === 'TRUE') : false;
                const title = c[6]?.v ? String(c[6].v).trim() : '';
                const notes = c[7]?.v ? String(c[7].v).trim() : '';

                if (title && isVis) {
                    parsed.push({
                        visible: isVis,
                        id: taskId,
                        parentId: parentId,
                        level: isNaN(level) ? 1 : level,
                        order: order,
                        checked: isChecked,
                        title: title,
                        notes: notes
                    });
                }
            });

            if (parsed.length > 0) {
                TASKS_DATA = parsed;
                // Silently update local storage backup
                localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
                updateSheetPillUI('healthy', 'Sheet: ' + shortId + ' ⚡ Synced', '✓ 200 OK Live Google Sheet Connected. Loaded ' + parsed.length + ' tasks.', false);
                renderAll();
                showToast('Synced with live Google Sheet!');
            } else {
                TASKS_DATA = [];
                updateSheetPillUI('healthy', 'Sheet: ' + shortId + ' ⚡ Empty', '✓ Live Google Sheet connected. No visible tasks found.', false);
                renderEmptyWelcomeState();
            }

        } catch(e) {
            handleConnectionFailure(isManualSync, 'Google Sheet query was blocked (CORS / Restricted). Please click Share > Anyone with the link can view.');
        }
    }

    function handleConnectionFailure(isManualSync, errorDetails) {
        const shortId = ACTIVE_GSHEET_ID.length > 12 ? (ACTIVE_GSHEET_ID.substring(0, 10) + '...') : ACTIVE_GSHEET_ID;
        
        // Attempt fallback to local storage backup
        const localBackup = localStorage.getItem('punchlist_backup_' + ACTIVE_GSHEET_ID);
        if (localBackup) {
            try {
                TASKS_DATA = JSON.parse(localBackup);
                updateSheetPillUI('warning', 'Sheet: Offline Backup', '⚠️ ' + errorDetails + '<br><br>Showing local cached backup.', true);
                renderAll();
                if (isManualSync) alert('Cannot reach live Google Sheet. Showing local offline backup.\n\nMake sure the sheet is shared as "Anyone with the link can view".');
                return;
            } catch(e) {}
        }

        // If no local backup exists, render Clean Slate with Error notice
        TASKS_DATA = [];
        updateSheetPillUI('error', 'Sheet: Connection Notice', '⚠️ ' + errorDetails, true);
        renderEmptyWelcomeState();
        if (isManualSync) alert('Failed to connect to Google Sheet:\n' + errorDetails);
    }

    // Identify Subtree Range (Parent + All Contiguous Descendants)
    function getSubtreeRange(parentIdx) {
        const parent = TASKS_DATA[parentIdx];
        if (!parent) return { start: parentIdx, count: 1 };

        let count = 1;
        for (let i = parentIdx + 1; i < TASKS_DATA.length; i++) {
            if (TASKS_DATA[i].level > parent.level) {
                count++;
            } else {
                break;
            }
        }
        return { start: parentIdx, count: count };
    }

    function getSectionRange(sectionHeaderIdx) {
        let count = 1;
        for (let i = sectionHeaderIdx + 1; i < TASKS_DATA.length; i++) {
            if (TASKS_DATA[i].level > 0) {
                count++;
            } else {
                break;
            }
        }
        return { start: sectionHeaderIdx, count: count };
    }

    // Render Grouped Accordion Sections with Folder-Hierarchy Nesting
    function renderAll() {
        const deckContainer = document.getElementById('deckContainer');
        deckContainer.innerHTML = '';

        if (!TASKS_DATA.length) {
            renderEmptyWelcomeState();
            return;
        }

        let currentSection = null;
        const sections = [];

        TASKS_DATA.forEach((task, index) => {
            if (task.level === 0) {
                currentSection = { header: task, tasks: [], headerIndex: index };
                sections.push(currentSection);
            } else {
                if (!currentSection) {
                    currentSection = { header: { title: "Tasks", id: "SEC_DEFAULT", level: 0 }, tasks: [], headerIndex: -1 };
                    sections.push(currentSection);
                }
                currentSection.tasks.push({ item: task, originalIndex: index });
            }
        });

        sections.forEach((sec, sIdx) => {
            const secId = sec.header.id || 'SEC_' + sIdx;
            const isCollapsed = Boolean(SECTION_STATES[secId]);

            const totalTasks = sec.tasks.length;
            const completedTasks = sec.tasks.filter(t => t.item.checked).length;
            const allDone = totalTasks > 0 && completedTasks === totalTasks;

            const deck = document.createElement('div');
            deck.className = 'section-deck ' + (isCollapsed ? 'is-collapsed' : '');
            deck.id = 'deck_' + secId;
            deck.dataset.sectionIndex = sIdx;
            deck.dataset.headerIndex = sec.headerIndex;

            deck.addEventListener('dragover', handleSectionDragOver);
            deck.addEventListener('dragleave', handleSectionDragLeave);
            deck.addEventListener('drop', handleSectionDrop);

            // Accordion Section Header
            const secHdr = document.createElement('div');
            secHdr.className = 'section-header';
            secHdr.onclick = (e) => {
                if (e.target.classList.contains('section-title') || e.target.classList.contains('drag-handle')) return;
                toggleSection(secId);
            };

            secHdr.innerHTML = `
                <div class="section-title-wrap">
                    <span class="drag-handle section-drag-handle" 
                          draggable="true" 
                          title="Drag to reorder section card" 
                          data-section-index="${sIdx}">⋮⋮</span>
                    <input type="text" class="section-title" value="${escapeHtml(sec.header.title)}" 
                           onchange="updateSectionTitle(${sec.headerIndex}, this.value)" 
                           onclick="event.stopPropagation();" />
                </div>
                <div class="section-meta-right">
                    <span class="section-counter-badge ${allDone ? 'all-done' : ''}">
                        ${completedTasks} / ${totalTasks} Completed
                    </span>
                    <span class="accordion-chevron">▼</span>
                </div>
            `;

            const secHandle = secHdr.querySelector('.section-drag-handle');
            secHandle.addEventListener('dragstart', handleSectionDragStart);
            secHandle.addEventListener('dragend', handleSectionDragEnd);

            deck.appendChild(secHdr);

            // Collapsible Section Body
            const secBody = document.createElement('div');
            secBody.className = 'section-body';

            const list = document.createElement('div');
            list.className = 'task-list';
            list.dataset.sectionIndex = sIdx;

            sec.tasks.forEach(tWrap => {
                const t = tWrap.item;
                const realIdx = tWrap.originalIndex;
                const isNested = t.level > 1;

                const dynamicPadding = Math.max(12, (t.level - 1) * 26 + 12);

                const row = document.createElement('div');
                row.className = 'task-row ' + (isNested ? 'is-nested ' : '') + (t.checked ? 'is-checked' : '');
                row.draggable = true;
                row.dataset.index = realIdx;
                row.style.paddingLeft = dynamicPadding + 'px';

                row.addEventListener('dragstart', handleTaskDragStart);
                row.addEventListener('dragover', handleTaskDragOver);
                row.addEventListener('dragleave', handleTaskDragLeave);
                row.addEventListener('drop', handleTaskDrop);
                row.addEventListener('dragend', handleTaskDragEnd);

                row.innerHTML = `
                    <span class="drag-handle task-drag-handle" title="Drag to reorder • Drag right/left to indent/unnest">⋮⋮</span>
                    ${isNested ? '<span class="nested-elbow">↳</span>' : ''}
                    <div class="task-checkbox-wrap">
                        <input type="checkbox" class="task-checkbox" ${t.checked ? 'checked' : ''} onchange="toggleTask(${realIdx})" />
                    </div>
                    <div class="task-body">
                        <input type="text" class="task-title-input" value="${escapeHtml(t.title)}" onchange="updateTaskTitle(${realIdx}, this.value)" />
                        <input type="text" class="task-notes-input" placeholder="Add note / description..." value="${escapeHtml(t.notes || '')}" onchange="updateTaskNotes(${realIdx}, this.value)" />
                    </div>
                    <div class="task-actions">
                        <button type="button" class="btn-icon" title="Outdent (Shift Left)" onclick="changeSubtreeLevel(${realIdx}, -1)">⇤</button>
                        <button type="button" class="btn-icon" title="Indent (Nest Right)" onclick="changeSubtreeLevel(${realIdx}, 1)">⇥</button>
                        <button type="button" class="btn-icon delete-btn" title="Delete task and subtasks" onclick="deleteSubtree(${realIdx})">✕</button>
                    </div>
                `;
                list.appendChild(row);
            });

            secBody.appendChild(list);

            const quickAdd = document.createElement('div');
            quickAdd.className = 'quick-add-wrap';
            quickAdd.innerHTML = `
                <input type="text" class="quick-add-input" placeholder="+ Add a task to this section (Press Enter)..." onkeydown="handleQuickAdd(event, ${sIdx})" />
            `;
            secBody.appendChild(quickAdd);

            deck.appendChild(secBody);
            deckContainer.appendChild(deck);
        });

        updateProgress();
    }

    function toggleSection(secId) {
        SECTION_STATES[secId] = !SECTION_STATES[secId];
        localStorage.setItem('epw_punch_sections_' + ACTIVE_GSHEET_ID, JSON.stringify(SECTION_STATES));
        
        const deck = document.getElementById('deck_' + secId);
        if (deck) {
            deck.classList.toggle('is-collapsed', SECTION_STATES[secId]);
        }
    }

    function toggleAllSections() {
        const decks = document.querySelectorAll('.section-deck');
        const anyOpen = Array.from(decks).some(d => !d.classList.contains('is-collapsed'));
        const btn = document.getElementById('btnToggleAll');

        decks.forEach(d => {
            const secId = d.id.replace('deck_', () => '');
            SECTION_STATES[secId] = anyOpen;
            d.classList.toggle('is-collapsed', anyOpen);
        });

        localStorage.setItem('epw_punch_sections_' + ACTIVE_GSHEET_ID, JSON.stringify(SECTION_STATES));
        if (btn) btn.innerText = anyOpen ? '▼ Expand All' : '☰ Collapse All';
    }

    function toggleTask(index) {
        if (!TASKS_DATA[index]) return;
        TASKS_DATA[index].checked = !TASKS_DATA[index].checked;
        localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        renderAll();
    }

    function changeSubtreeLevel(parentIdx, delta) {
        if (!TASKS_DATA[parentIdx]) return;
        const range = getSubtreeRange(parentIdx);
        const parentCurrentLevel = TASKS_DATA[parentIdx].level || 1;

        if (delta > 0) {
            const prevItem = TASKS_DATA[parentIdx - 1];
            const maxAllowed = prevItem ? (prevItem.level === 0 ? 1 : prevItem.level + 1) : 1;
            if (parentCurrentLevel >= maxAllowed) {
                showToast("Cannot nest deeper than previous item");
                return;
            }
        } else if (delta < 0) {
            if (parentCurrentLevel <= 1) return;
        }

        for (let i = range.start; i < range.start + range.count; i++) {
            TASKS_DATA[i].level = Math.max(1, (TASKS_DATA[i].level || 1) + delta);
        }

        localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        renderAll();
    }

    function deleteSubtree(parentIdx) {
        if (!TASKS_DATA[parentIdx]) return;
        const range = getSubtreeRange(parentIdx);
        TASKS_DATA.splice(range.start, range.count);
        localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        renderAll();
        showToast(range.count > 1 ? ('Deleted task and ' + (range.count - 1) + ' subtask(s)') : 'Task removed');
    }

    function updateTaskTitle(index, val) {
        if (TASKS_DATA[index]) {
            TASKS_DATA[index].title = val.trim();
            localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        }
    }

    function updateTaskNotes(index, val) {
        if (TASKS_DATA[index]) {
            TASKS_DATA[index].notes = val.trim();
            localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        }
    }

    function updateSectionTitle(index, val) {
        if (TASKS_DATA[index]) {
            TASKS_DATA[index].title = val.trim();
            localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        }
    }

    function handleQuickAdd(e, sectionIndex) {
        if (e.key === 'Enter' && e.target.value.trim()) {
            const title = e.target.value.trim();
            e.target.value = '';

            const newTask = {
                visible: true,
                id: 'TASK_' + Date.now().toString().slice(-6),
                parentId: '',
                level: 1,
                order: TASKS_DATA.length + 1,
                checked: false,
                title: title,
                notes: ''
            };

            let insertAt = TASKS_DATA.length;
            let currentSec = 0;
            for (let i = 0; i < TASKS_DATA.length; i++) {
                if (TASKS_DATA[i].level === 0) {
                    if (currentSec === sectionIndex + 1) {
                        insertAt = i;
                        break;
                    }
                    currentSec++;
                }
            }

            TASKS_DATA.splice(insertAt, 0, newTask);
            localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
            renderAll();
            showToast('Added task: ' + title);
        }
    }

    function addNewSection() {
        const title = prompt('Enter New Section Title:', '1. Project Setup');
        if (title && title.trim()) {
            TASKS_DATA.push({
                visible: true,
                id: 'SEC_' + Date.now().toString().slice(-6),
                parentId: '',
                level: 0,
                order: TASKS_DATA.length + 1,
                checked: false,
                title: title.trim(),
                notes: ''
            });
            localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
            renderAll();
            showToast('Created section: ' + title);
        }
    }

    // =========================================================================
    // SECTION & SUBTREE DRAG AND DROP
    // =========================================================================
    function handleSectionDragStart(e) {
        IS_DRAGGING_SECTION = true;
        DRAGGED_SECTION_INDEX = parseInt(this.dataset.sectionIndex, 10);

        const deck = this.closest('.section-deck');
        if (deck) deck.classList.add('section-dragging');

        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'SECTION_' + DRAGGED_SECTION_INDEX);
        e.stopPropagation();
    }

    function handleSectionDragOver(e) {
        if (!IS_DRAGGING_SECTION) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        const hoverSectionIdx = parseInt(this.dataset.sectionIndex, 10);
        if (isNaN(hoverSectionIdx) || hoverSectionIdx === DRAGGED_SECTION_INDEX) {
            removeSectionDropIndicator();
            return;
        }

        const rect = this.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        const position = (e.clientY < midY) ? 'before' : 'after';

        renderSectionDropIndicator(this, position);
    }

    function renderSectionDropIndicator(targetDeck, position) {
        removeSectionDropIndicator();

        const line = document.createElement('div');
        line.className = 'section-drop-indicator';
        line.id = 'activeSectionDropIndicator';

        if (position === 'before') {
            targetDeck.parentElement.insertBefore(line, targetDeck);
        } else {
            targetDeck.parentElement.insertBefore(line, targetDeck.nextSibling);
        }
    }

    function removeSectionDropIndicator() {
        const existing = document.getElementById('activeSectionDropIndicator');
        if (existing) existing.remove();
    }

    function handleSectionDragLeave(e) {
        if (!e.relatedTarget || !e.relatedTarget.closest('#deckContainer')) {
            removeSectionDropIndicator();
        }
    }

    function handleSectionDrop(e) {
        if (!IS_DRAGGING_SECTION) return;
        e.preventDefault();
        removeSectionDropIndicator();

        const hoverSectionIdx = parseInt(this.dataset.sectionIndex, 10);
        if (isNaN(hoverSectionIdx) || hoverSectionIdx === DRAGGED_SECTION_INDEX) return;

        const rect = this.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        const position = (e.clientY < midY) ? 'before' : 'after';

        const sectionHeaderIndices = [];
        TASKS_DATA.forEach((t, i) => {
            if (t.level === 0) sectionHeaderIndices.push(i);
        });

        const sourceHeaderIdx = sectionHeaderIndices[DRAGGED_SECTION_INDEX];
        const sourceRange = getSectionRange(sourceHeaderIdx);

        const movingSectionTasks = TASKS_DATA.splice(sourceRange.start, sourceRange.count);

        const newHeaderIndices = [];
        TASKS_DATA.forEach((t, i) => {
            if (t.level === 0) newHeaderIndices.push(i);
        });

        let targetHeaderIdx = newHeaderIndices[hoverSectionIdx > DRAGGED_SECTION_INDEX ? hoverSectionIdx - 1 : hoverSectionIdx];
        let insertAt = 0;

        if (position === 'before') {
            insertAt = targetHeaderIdx;
        } else {
            const targetRange = getSectionRange(targetHeaderIdx);
            insertAt = targetRange.start + targetRange.count;
        }

        TASKS_DATA.splice(insertAt, 0, ...movingSectionTasks);

        localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        renderAll();
        showToast('Section reordered!');
    }

    function handleSectionDragEnd() {
        IS_DRAGGING_SECTION = false;
        DRAGGED_SECTION_INDEX = null;
        removeSectionDropIndicator();
        document.querySelectorAll('.section-deck').forEach(d => d.classList.remove('section-dragging'));
    }

    function handleTaskDragStart(e) {
        if (IS_DRAGGING_SECTION) return;

        DRAG_START_INDEX = parseInt(this.dataset.index, 10);
        DRAG_START_X = e.clientX;
        const range = getSubtreeRange(DRAG_START_INDEX);
        DRAG_SUBTREE_COUNT = range.count;

        this.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(DRAG_START_INDEX));
        e.stopPropagation();

        const allRows = document.querySelectorAll('.task-row');
        for (let i = 0; i < allRows.length; i++) {
            const idx = parseInt(allRows[i].dataset.index, 10);
            if (idx > DRAG_START_INDEX && idx < DRAG_START_INDEX + DRAG_SUBTREE_COUNT) {
                allRows[i].classList.add('is-subtree-child');
            }
        }
    }

    function handleTaskDragOver(e) {
        if (IS_DRAGGING_SECTION) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        const hoverIdx = parseInt(this.dataset.index, 10);
        if (isNaN(hoverIdx)) return;

        if (hoverIdx >= DRAG_START_INDEX && hoverIdx < DRAG_START_INDEX + DRAG_SUBTREE_COUNT) {
            removeDropIndicator();
            return;
        }

        DRAG_CURRENT_HOVER_INDEX = hoverIdx;
        const rect = this.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        DRAG_TARGET_POSITION = (e.clientY < midY) ? 'before' : 'after';

        let tentativeInsertAt = (DRAG_TARGET_POSITION === 'before') ? hoverIdx : hoverIdx + 1;
        if (DRAG_START_INDEX < tentativeInsertAt) {
            tentativeInsertAt -= DRAG_SUBTREE_COUNT;
        }

        const remainingTasks = TASKS_DATA.filter((_, idx) => idx < DRAG_START_INDEX || idx >= DRAG_START_INDEX + DRAG_SUBTREE_COUNT);
        const prevItem = (tentativeInsertAt > 0) ? remainingTasks[tentativeInsertAt - 1] : null;

        let maxAllowedLevel = 1;
        if (prevItem) {
            maxAllowedLevel = (prevItem.level === 0) ? 1 : prevItem.level + 1;
        }

        const deltaX = e.clientX - DRAG_START_X;
        const levelShift = Math.round(deltaX / 26);
        const parentItem = TASKS_DATA[DRAG_START_INDEX];
        const baseLevel = parentItem ? parentItem.level : 1;

        DRAG_PROPOSED_LEVEL = Math.max(1, Math.min(baseLevel + levelShift, maxAllowedLevel));

        renderDropIndicator(this, DRAG_TARGET_POSITION, DRAG_PROPOSED_LEVEL);
    }

    function renderDropIndicator(targetRow, position, proposedLevel) {
        removeDropIndicator();

        const line = document.createElement('div');
        line.className = 'drop-indicator-line';
        line.id = 'activeDropIndicator';

        const lineIndent = Math.max(12, (proposedLevel - 1) * 26 + 12);
        line.style.marginLeft = lineIndent + 'px';

        if (position === 'before') {
            targetRow.parentElement.insertBefore(line, targetRow);
        } else {
            targetRow.parentElement.insertBefore(line, targetRow.nextSibling);
        }
    }

    function removeDropIndicator() {
        const existing = document.getElementById('activeDropIndicator');
        if (existing) existing.remove();
    }

    function handleTaskDragLeave(e) {
        if (!e.relatedTarget || !e.relatedTarget.closest('.task-list')) {
            removeDropIndicator();
        }
    }

    function handleTaskDrop(e) {
        if (IS_DRAGGING_SECTION) return;
        e.preventDefault();
        removeDropIndicator();

        if (DRAG_START_INDEX === null || DRAG_CURRENT_HOVER_INDEX === null) return;
        if (DRAG_CURRENT_HOVER_INDEX >= DRAG_START_INDEX && DRAG_CURRENT_HOVER_INDEX < DRAG_START_INDEX + DRAG_SUBTREE_COUNT) {
            return;
        }

        const subtree = TASKS_DATA.splice(DRAG_START_INDEX, DRAG_SUBTREE_COUNT);
        const oldParentLevel = subtree[0].level || 1;
        const effectiveLevelShift = DRAG_PROPOSED_LEVEL - oldParentLevel;

        subtree.forEach(item => {
            item.level = Math.max(1, item.level + effectiveLevelShift);
        });

        let targetIdx = DRAG_CURRENT_HOVER_INDEX;
        if (DRAG_START_INDEX < targetIdx) {
            targetIdx -= DRAG_SUBTREE_COUNT;
        }

        let insertAt = (DRAG_TARGET_POSITION === 'before') ? targetIdx : targetIdx + 1;
        if (insertAt < 0) insertAt = 0;
        if (insertAt > TASKS_DATA.length) insertAt = TASKS_DATA.length;

        TASKS_DATA.splice(insertAt, 0, ...subtree);

        localStorage.setItem('punchlist_backup_' + ACTIVE_GSHEET_ID, JSON.stringify(TASKS_DATA));
        renderAll();
        showToast('Task & subtasks moved');
    }

    function handleTaskDragEnd() {
        removeDropIndicator();
        document.querySelectorAll('.task-row').forEach(row => {
            row.classList.remove('is-dragging', 'is-subtree-child');
        });
        DRAG_START_INDEX = null;
        DRAG_CURRENT_HOVER_INDEX = null;
    }

    function updateProgress() {
        const actionable = TASKS_DATA.filter(t => t.level > 0);
        const completed = actionable.filter(t => t.checked).length;
        const total = actionable.length;
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressStats').innerText = completed + ' / ' + total + ' Completed (' + pct + '%)';
    }

    // 1-Click TSV Exporter (Strict Rule 5 Function Callback Replacement)
    function copyTSVToClipboard() {
        const headers = ['VISIBLE ( Admin Form )', 'TASK_ID', 'PARENT_ID', 'LEVEL', 'ORDER', 'CHECKED', 'TASK_TITLE', 'TASK_NOTES'];
        const lines = [headers.join('\t')];

        TASKS_DATA.forEach((t, i) => {
            lines.push([
                t.visible ? 'TRUE' : 'FALSE',
                t.id || 'TASK_' + (i + 1),
                t.parentId || '',
                t.level || 0,
                i + 1,
                t.checked ? 'TRUE' : 'FALSE',
                (t.title || '').replace(/\t/g, () => ' '),
                (t.notes || '').replace(/\t/g, () => ' ')
            ].join('\t'));
        });

        const tsvOutput = lines.join('\n');
        navigator.clipboard.writeText(tsvOutput).then(() => {
            showToast('📋 Copied full TSV! Ready to paste into Google Sheet.');
        }).catch(() => {
            showToast('Failed to copy. Please allow clipboard permissions.');
        });
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, () => '&amp;')
            .replace(/</g, () => '&lt;')
            .replace(/>/g, () => '&gt;')
            .replace(/"/g, () => '&quot;')
            .replace(/'/g, () => '&#039;');
    }

    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
